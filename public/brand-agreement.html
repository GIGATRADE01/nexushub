<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brand Framework Agreement — NexusHub</title>
<meta name="description" content="Framework Agreement between NexusHub (GIGA TRADE S.R.L.S.) and Brands using the platform. Available in 7 languages.">
<style>
:root{--bg:#08080f;--card:#0f1018;--gold:#c9a84c;--txt:#e9e6df;--mut:#9aa3c0;--bd:#252838}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.7 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:840px;margin:0 auto;padding:44px 22px 80px}
a{color:var(--gold)}
h1{font-size:29px;margin:0 0 6px;color:var(--gold);letter-spacing:.02em}
h2{font-size:18px;margin:32px 0 8px;color:var(--gold)}
.brand{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin-bottom:20px}
.upd{font-size:13px;color:var(--mut);margin-bottom:22px}
.box{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--gold);border-radius:10px;padding:16px 18px;margin:16px 0}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
th,td{border:1px solid var(--bd);padding:9px 11px;text-align:left;vertical-align:top}
th{background:#151720;color:var(--gold);font-weight:600}
ul{padding-left:20px}li{margin:5px 0}
p{margin:8px 0}
.lang{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.lang button{padding:6px 14px;border:1px solid var(--bd);border-radius:20px;background:transparent;color:var(--mut);font-size:13px;cursor:pointer;font-family:inherit}
.lang button.on{background:var(--gold);color:#08080f;border-color:var(--gold);font-weight:600}
footer{margin-top:48px;padding-top:22px;border-top:1px solid var(--bd);font-size:13px;color:var(--mut)}
[dir="rtl"] table th,[dir="rtl"] table td{text-align:right}
[dir="rtl"] ul{padding-right:20px;padding-left:0}
[dir="rtl"] .box{border-left:1px solid var(--bd);border-right:3px solid var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">NexusHub · The European Distribution Platform</div>
  <div class="lang" id="langbar"></div>
  <div id="doc"></div>
  <footer>
    NexusHub · GIGA TRADE S.R.L.S. · Via Ottavio Revel 6, 10121 Torino (TO), Italia · P.IVA IT13105910015<br>
    <a href="/">← nexushub.trade</a> · <a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a>
  </footer>
</div>
<script src="/legal-i18n.js"></script>
<script>
(function(){
  var DOC = "brand";
  var bar = document.getElementById("langbar"), out = document.getElementById("doc");
  function pick(){
    var h = (location.hash || "").replace("#","");
    if (window.LEGAL[DOC][h]) return h;
    var nav = (navigator.language || "en").slice(0,2).toLowerCase();
    return window.LEGAL[DOC][nav] ? nav : "en";
  }
  function render(lang){
    var d = window.LEGAL[DOC][lang];
    var meta = window.LEGAL_LANGS.filter(function(l){ return l.k === lang; })[0] || { dir:"ltr" };
    document.documentElement.lang = lang;
    out.setAttribute("dir", meta.dir);
    var html = "<h1>" + d.title + "</h1><div class='upd'>" + d.updated + "</div>";
    d.sections.forEach(function(s){
      html += "<h2>" + s[0] + "</h2>" + s[1];
    });
    out.innerHTML = html;
    Array.prototype.forEach.call(bar.children, function(b){
      b.className = (b.dataset.k === lang) ? "on" : "";
    });
  }
  window.LEGAL_LANGS.forEach(function(l){
    var b = document.createElement("button");
    b.textContent = l.name; b.dataset.k = l.k;
    b.onclick = function(){ location.hash = l.k; render(l.k); };
    bar.appendChild(b);
  });
  render(pick());
  window.addEventListener("hashchange", function(){ render(pick()); });
})();
</script>
</body>
</html>
